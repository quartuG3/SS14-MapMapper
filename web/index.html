<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SS14 Shuttle Mapper</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><i data-icon="logo"></i> Shuttle Mapper</div>
    <div class="menu">
      <button data-act="new" title="Новый шаттл">Новый</button>
      <button data-act="open" title="Открыть карту из репозитория (Ctrl+O)">Открыть</button>
      <button data-act="save" title="Сохранить (Ctrl+S): скачать .yml или записать в репозиторий — выбирается в диалоге">Сохранить</button>
      <button data-act="saveas" title="Сохранить как…">Сохранить как</button>
      <span class="sep"></span>
      <button data-act="undo" title="Отменить (Ctrl+Z)"><i data-icon="undo"></i></button>
      <button data-act="redo" title="Повторить (Ctrl+Y)"><i data-icon="redo"></i></button>
      <span class="sep"></span>
      <div class="seg" id="modeSeg" title="Режим редактора">
        <button data-mode="normal" class="on">Обычный</button>
        <button data-mode="wiring"><i data-icon="zap"></i> Проводка</button>
        <button data-mode="atmos"><i data-icon="pipe"></i> Атмос</button>
        <button data-mode="disposal"><i data-icon="disposal"></i> Утилизация</button>
      </div>
      <span class="sep"></span>
      <div class="seg" title="Зеркалирование (кисти рисуют симметрично)">
        <button data-act="mirrorX" id="btnMirrorX" title="Зеркало по X (вертикальная ось)"><i data-icon="flipX"></i> X</button>
        <button data-act="mirrorY" id="btnMirrorY" title="Зеркало по Y (горизонтальная ось)"><i data-icon="flipY"></i> Y</button>
        <button data-act="mirrorCfg" id="btnMirrorCfg" title="Настройка симметрии: оси и пресеты отражений"><i data-icon="settings"></i></button>
      </div>
      <span class="sep"></span>
      <button data-act="export" title="Экспорт запечённого PNG">Экспорт PNG</button>
      <button data-act="downloadYml" title="Скачать YML без записи в репозиторий">YML</button>
      <span class="sep"></span>
      <button data-act="validate" title="Проверка шаттла">Проверка</button>
      <button data-act="radar" title="Сканер масс: шаттл так, как его показывает радар в игре">Сканер</button>
      <button data-act="findReplace" title="Поиск и замена (Ctrl+H)">Замена</button>
      <button data-act="pipelines" title="Пайплайны: скрипты из папки pipelines/ или свои .js — проверки, массовые замены, экспорт">Пайплайны</button>
      <button data-act="names" title="Названия и описания предметов, тексты бумаг (F2)">Названия</button>
      <button data-act="vessel" title="Прототип вессела для Shipyard">Вессел</button>
      <button data-act="help" title="Горячие клавиши (F1)"><i data-icon="help"></i></button>
    </div>
    <div id="docTitle"></div>
    <span id="gridPick"></span>
  </header>

  <nav id="toolbar"></nav>

  <main id="stage">
    <canvas id="rulerTop"></canvas>
    <canvas id="rulerLeft"></canvas>
    <div id="rulerCorner" title="Линейки: тяните с линейки, чтобы создать направляющую"><i data-icon="hash"></i></div>
    <canvas id="view" tabindex="0"></canvas>
    <div id="toolOptions"></div>
    <div id="toast"></div>
    <div id="loading">Загрузка прототипов…</div>
  </main>

  <aside id="side">
    <div class="tabs" id="sideTabs">
      <button data-tab="palette" class="on">Палитра</button>
      <button data-tab="inspector">Инспектор</button>
      <button data-tab="layers">Слои</button>
      <button data-tab="random">Рандом</button>
      <button data-tab="prefabs">Префабы</button>
      <button data-tab="stats">Сводка</button>
    </div>
    <section id="tab-palette" class="tab on">
      <div class="seg full" id="palKind">
        <button data-kind="tile" class="on">Тайлы</button>
        <button data-kind="entity">Прототипы</button>
        <button data-kind="decal">Декали</button>
        <button data-kind="custom" title="Свои палитры: Shift+клик по элементу каталога добавляет его в активную палитру"><i data-icon="star"></i> Свои</button>
      </div>
      <div id="palCustomBar" style="display:none"></div>
      <div class="row">
        <input id="palSearch" type="search" placeholder="Поиск (id / имя / рус.)">
        <div class="seg" id="palViewSeg" title="Вид палитры">
          <button data-view="grid" title="Сетка: иконка и id"><i data-icon="grid"></i></button>
          <button data-view="gallery" title="Галерея: крупная иконка и название"><i data-icon="gallery"></i></button>
          <button data-view="list" title="Список: иконка, название и прототип"><i data-icon="list"></i></button>
        </div>
      </div>
      <div class="row" id="palCatRow">
        <select id="palCat"></select>
        <label class="chk"><input type="checkbox" id="palHidden"> скрытые</label>
      </div>
      <div id="palRecent" class="pal-grid small"></div>
      <div id="palGrid" class="pal-grid"></div>
      <div id="palInfo" class="muted"></div>
    </section>
    <section id="tab-inspector" class="tab"></section>
    <section id="tab-layers" class="tab"></section>
    <section id="tab-random" class="tab"></section>
    <section id="tab-prefabs" class="tab"></section>
    <section id="tab-stats" class="tab"></section>
  </aside>

  <footer id="status">
    <div id="loadBar" class="hidden"><div></div></div>
    <span id="stCursor">—</span>
    <span id="stSel"></span>
    <span id="stZoom"></span>
    <span id="stCounts"></span>
    <span id="stMsg"></span>
    <span id="stLoad"></span>
  </footer>
</div>

<div id="modal" class="hidden"><div class="modal-box"><div class="modal-head"><span id="modalTitle"></span><button id="modalClose"><i data-icon="x"></i></button></div><div id="modalBody"></div></div></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
